[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyocr-onnx"
version = "0.1.0"
description = "Offline CPU OCR with 3.10 MB of bundled PaddleOCR-derived ONNX models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Maureese Williams"}]
keywords = ["ocr", "onnx", "paddleocr", "offline", "cpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.3.0",
  "omegaconf==2.4.0",
]

[project.urls]
Homepage = "https://github.com/MMWilliams/tinyocr"
Repository = "https://github.com/MMWilliams/tinyocr"
Models = "https://huggingface.co/maureesewilliams/tinyocr"
Issues = "https://github.com/MMWilliams/tinyocr/issues"

[project.scripts]
tinyocr = "tinyocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyocr = ["assets/*.onnx", "assets/*.json", "assets/NOTICE"]
